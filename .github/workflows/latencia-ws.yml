name: Latencia WS
on:
  workflow_dispatch:
jobs:
  latencia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ejecutar script
        env:
          WS_URL: ${{ vars.WS_URL }}
          SERENO_TOKEN: ${{ secrets.SERENO_TOKEN }}
          OPERADOR_TOKEN: ${{ secrets.OPERADOR_TOKEN }}
          UNIDAD_ID: ${{ vars.UNIDAD_ID }}
          N: '100'
        run: |
          cd backend
          npm ci --omit=dev 2>/dev/null || true
          node scripts/medir-latencia-ws.mjs | tee /tmp/out.txt
          echo "## Latencia" >> $GITHUB_STEP_SUMMARY
          cat /tmp/out.txt >> $GITHUB_STEP_SUMMARY
      - name: Nota
        run: |
          echo "Limitacion: medicion desde servidores de GitHub, no desde Tumbes. Cold start medir con --cold por separado." >> $GITHUB_STEP_SUMMARY
