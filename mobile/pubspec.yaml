name: alerta_aguas_verdes
description: "App de alerta y reporte de incidencias para la municipalidad de Aguas Verdes."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Estado: BLoC/Cubit (MVVM)
  flutter_bloc: ^9.1.1
  bloc: ^9.0.1
  equatable: ^2.0.7

  # Navegacion declarativa con guardas por rol
  go_router: ^16.2.1

  # Red: Dio + interceptores (inyecta JWT, refresca en 401, reintenta)
  dio: ^5.9.0

  # Persistencia de tokens
  flutter_secure_storage: ^9.2.4

  # Mapas gratuitos (OpenStreetMap / tiles de OSM, sin API key)
  flutter_map: ^8.2.2
  latlong2: ^0.9.1

  # GPS
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # Evidencias
  image_picker: ^1.2.1

  # Inyeccion de dependencias
  get_it: ^8.0.3

  # Modelos inmutables + JSON
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Cache local del mapa (offline)
  hive_ce: ^2.11.3
  path_provider: ^2.1.5

  # UI
  intl: ^0.20.2

  # Abrir tel: y wa.me desde la central de emergencias
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^3.2.0
  json_serializable: ^6.11.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true